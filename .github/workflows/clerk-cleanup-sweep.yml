# .github/workflows/clerk-cleanup-sweep.yml
#
# Independent trigger for the pending-Clerk-cleanup retry sweep —
# app/routes/api.clerk-cleanup-sweep.ts, which processes a bounded batch
# (25) of PendingClerkCleanup rows via the exact same retryPendingClerkCleanup
# call /admin/maintenance's manual button already uses. Before this, the
# ONLY way a failed Clerk deletion (from an unattended customers/redact or
# shop/redact webhook) ever got retried was a human manually clicking it —
# see clerk-cleanup.server.ts's own header. This file, mirroring
# full-look-vto-sweep.yml's and export-zip-sweep.yml's own already-reviewed
# pattern exactly, makes an automated retry actually possible.
#
# NOT ACTIVE YET, same as those two: GitHub only honors a `schedule`
# trigger from the copy of this file that exists on the repository's
# DEFAULT branch — this file currently sits on an isolated audit branch,
# so nothing fires until a human explicitly pushes and merges it to `main`,
# an action not taken here.
#
# Requires a repository secret named CLERK_CLEANUP_SWEEP_SECRET, which does
# NOT exist yet and was not created by this change. Its value must equal
# the target Vercel project's own CLERK_CLEANUP_SWEEP_SECRET — a secret
# dedicated to this one endpoint's one capability (retrying an already-
# recorded, already-failed Clerk deletion), never a broader-access secret.
# Add it via GitHub → this repo → Settings → Secrets and variables →
# Actions → New repository secret — a step for a human with repo-admin
# access, not taken here.
#
# Target URL: naia-stylist-staging.vercel.app, matching export-zip-sweep.yml's
# own current target — this sweep has not been verified against a live
# production deployment in this session (the underlying Clerk-deletion fix,
# d109859, is itself held for Founder Decision 3c approval and is not yet
# merged anywhere). Update the URL (and which secret scope it reads) once
# that's resolved and the feature's real deployment target is confirmed —
# do not assume staging is correct without checking at that time.

name: Pending Clerk cleanup retry sweep

on:
  schedule:
    # Every 30 minutes — this is a retry for an already-durably-recorded
    # failure (not a time-sensitive cleanup like the VTO sweep's 30-minute
    # pause expiry), so a slower cadence than that sweep's 10 minutes is
    # appropriate; still far more frequent than "whenever a human happens
    # to remember to check /admin/maintenance."
    - cron: "*/30 * * * *"
  # Lets a human fire one sweep on demand from the Actions tab, without
  # waiting for the schedule — zero cost, no new auth surface.
  workflow_dispatch: {}

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Invoke the Clerk cleanup sweep endpoint
        run: |
          status=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            "https://naia-stylist-staging.vercel.app/api/clerk-cleanup-sweep" \
            -H "x-clerk-cleanup-sweep-secret: ${{ secrets.CLERK_CLEANUP_SWEEP_SECRET }}")
          echo "HTTP status: $status"
          cat /tmp/response.json
          if [ "$status" != "200" ]; then
            echo "Sweep request failed (HTTP $status)" >&2
            exit 1
          fi

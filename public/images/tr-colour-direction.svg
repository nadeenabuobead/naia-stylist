<svg viewBox="0 0 600 750" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cd-cream" x1="0" y1="0" x2="0.05" y2="1">
      <stop offset="0%" stop-color="#f0e9de"/>
      <stop offset="100%" stop-color="#e6dece"/>
    </linearGradient>
    <linearGradient id="cd-espresso" x1="0" y1="0" x2="0.1" y2="1">
      <stop offset="0%" stop-color="#2a1c0e"/>
      <stop offset="100%" stop-color="#1e1408"/>
    </linearGradient>
    <filter id="cd-glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Cream/linen base — the quiet foundation (top ~56%) -->
  <rect width="600" height="750" fill="url(#cd-cream)"/>

  <!-- Espresso anchor — the deep grounding element (lower ~44%) -->
  <rect x="0" y="418" width="600" height="332" fill="url(#cd-espresso)"/>

  <!-- Transition line — the moment of contrast -->
  <line x1="0" y1="418" x2="600" y2="418" stroke="#c8a87a" stroke-width="0.8" opacity="0.35"/>

  <!-- The deliberate accent interruption — one clear colour note -->
  <!-- A strong vertical burgundy element cutting across the cream/espresso boundary -->
  <!-- Positioned deliberately off-centre — intentional, not decorative accident -->
  <rect x="164" y="354" width="72" height="208" fill="#7a1e28"/>

  <!-- Subtle highlight on the accent leading edge -->
  <rect x="164" y="354" width="3" height="208" fill="#a03040" opacity="0.5"/>

  <!-- How the cream base interacts with the espresso anchor -->
  <!-- A thin cream horizontal element within the espresso zone — base colour persisting -->
  <rect x="310" y="502" width="188" height="2.5" fill="#e6dece" opacity="0.6"/>
  <rect x="310" y="518" width="120" height="1.5" fill="#e6dece" opacity="0.35"/>

  <!-- A thin line element in cream at the top of the espresso zone -->
  <!-- Suggesting how quiet base and dark anchor read against each other -->
  <rect x="310" y="428" width="240" height="1.5" fill="#c8a878" opacity="0.4"/>

  <!-- Architectural frame — top rule -->
  <line x1="44" y1="44" x2="556" y2="44" stroke="#9a8a78" stroke-width="0.65" opacity="0.38"/>
  <!-- Left rule -->
  <line x1="44" y1="44" x2="44" y2="706" stroke="#9a8a78" stroke-width="0.65" opacity="0.25"/>
  <!-- Bottom rule — against dark background, use lighter line -->
  <line x1="44" y1="706" x2="556" y2="706" stroke="#c8a878" stroke-width="0.65" opacity="0.28"/>

  <!-- Label — against dark background -->
  <text x="58" y="730" font-family="'Courier New', Courier, monospace" font-size="8" letter-spacing="4.5" fill="#c8a878" opacity="0.55">COLOUR DIRECTION · SS'26</text>
</svg>

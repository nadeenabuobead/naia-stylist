<svg viewBox="0 0 600 750" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ss-bg" x1="0" y1="0" x2="0.15" y2="1">
      <stop offset="0%" stop-color="#f3ece3"/>
      <stop offset="100%" stop-color="#e8dfd3"/>
    </linearGradient>
    <linearGradient id="ss-f1" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#cfc1af"/>
      <stop offset="50%" stop-color="#c0b09e"/>
      <stop offset="100%" stop-color="#b8a898"/>
    </linearGradient>
    <linearGradient id="ss-f2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d8ccba"/>
      <stop offset="100%" stop-color="#c8b8a6"/>
    </linearGradient>
    <linearGradient id="ss-f3" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#e0d4c0"/>
      <stop offset="100%" stop-color="#d0c4b0"/>
    </linearGradient>
    <filter id="ss-blur">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
    <filter id="ss-shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="14" flood-color="#8a7a68" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="750" fill="url(#ss-bg)"/>

  <!-- Soft ambient depth -->
  <ellipse cx="300" cy="420" rx="240" ry="280" fill="#9a8a78" opacity="0.06" filter="url(#ss-blur)"/>

  <!-- Fabric fold 1 — base layer, wide diagonal band, lower-left origin -->
  <!-- Suggests a wide draped fabric panel, the foundation of the composition -->
  <path d="
    M -10 560
    C 60 490, 180 455, 320 448
    C 460 441, 560 415, 610 390
    L 610 640
    C 550 660, 430 675, 280 678
    C 130 681, 40 690, -10 700
    Z
  " fill="url(#ss-f1)" opacity="0.92" filter="url(#ss-shadow)"/>

  <!-- Fabric fold 2 — mid layer, centered diagonal, slightly narrower -->
  <!-- A second layer of draped fabric overlapping the base -->
  <path d="
    M -10 340
    C 80 282, 210 260, 360 258
    C 490 256, 570 238, 610 225
    L 610 440
    C 570 454, 470 468, 340 472
    C 200 476, 80 498, -10 555
    Z
  " fill="url(#ss-f2)" opacity="0.88" filter="url(#ss-shadow)"/>

  <!-- Fabric fold 3 — top layer, narrowest, higher in frame -->
  <!-- The highest/most visible fold, creating depth and structural interest -->
  <path d="
    M 60 145
    C 150 108, 270 96, 400 100
    C 500 103, 570 90, 610 82
    L 610 268
    C 565 280, 475 290, 360 290
    C 230 290, 120 305, 60 335
    Z
  " fill="url(#ss-f3)" opacity="0.85" filter="url(#ss-shadow)"/>

  <!-- Subtle highlight ridge on fold 3 — where fabric peaks before falling -->
  <path d="M 90 168 C 200 136, 340 128, 490 134 C 540 136, 578 130, 610 124"
        fill="none" stroke="#f0e8da" stroke-width="1.8" opacity="0.55" stroke-linecap="round"/>

  <!-- Subtle shadow trough between fold 2 and fold 3 -->
  <path d="M 50 310 C 170 275, 320 265, 480 272 C 545 275, 590 268, 610 264"
        fill="none" stroke="#8a7a68" stroke-width="0.9" opacity="0.28" stroke-linecap="round"/>

  <!-- Architectural frame — top rule -->
  <line x1="44" y1="44" x2="556" y2="44" stroke="#9a8a78" stroke-width="0.65" opacity="0.35"/>
  <!-- Architectural frame — left rule -->
  <line x1="44" y1="44" x2="44" y2="706" stroke="#9a8a78" stroke-width="0.65" opacity="0.28"/>
  <!-- Architectural frame — bottom rule -->
  <line x1="44" y1="706" x2="556" y2="706" stroke="#9a8a78" stroke-width="0.65" opacity="0.28"/>

  <!-- Label -->
  <text x="58" y="730" font-family="'Courier New', Courier, monospace" font-size="8" letter-spacing="4.5" fill="#8a7a68" opacity="0.6">SOFT STRUCTURE · SS'26</text>
</svg>

# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "a1c349cee05c491058a66830fb364500"
name = "naia-stylist"
application_url = "https://naia-stylist.vercel.app"
embedded = true

[webhooks]
api_version = "2026-04"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  # Phase 2 privacy remediation (2026-10-19) — the three mandatory customer-
  # privacy webhooks, previously entirely unregistered. Local config only;
  # not yet pushed live via `shopify app deploy` — that is a separate,
  # not-yet-authorised step. See webhooks.customers.data_request.tsx,
  # webhooks.customers.redact.tsx, webhooks.shop.redact.tsx.
  #
  # These three MUST use `compliance_topics`, not `topics` — Shopify treats
  # that as a distinct mandatory-compliance subscription kind (confirmed
  # against current shopify.dev docs 2026-10-19). An earlier version of this
  # file used `topics` by mistake, which is exactly the shape Shopify's own
  # MISSING_COMPLIANCE_WEBHOOKS app-store review check flags as absent.
  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/data_request" ]
  uri = "/webhooks/customers/data_request"

  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/redact" ]
  uri = "/webhooks/customers/redact"

  [[webhooks.subscriptions]]
  compliance_topics = [ "shop/redact" ]
  uri = "/webhooks/shop/redact"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "write_metaobject_definitions,write_metaobjects,write_products"

[auth]
redirect_urls = [ "https://naia-stylist.vercel.app/api/auth" ]

[app_proxy]
url = "https://naia-stylist.vercel.app"
subpath = "naia-stylist"
prefix = "apps"

[customer_authentication]
redirect_uris = [
  "https://naia-stylist-staging-nadeenabuobeads-projects.vercel.app/auth/shopify/callback",
  "https://nadine-storefront-nadeenabuobeads-projects.vercel.app/auth/shopify/callback",
  "https://naia-stylist.vercel.app/auth/shopify/callback"
]
logout_urls = [
  "https://naia-stylist-staging-nadeenabuobeads-projects.vercel.app/auth/logout",
  "https://nadine-storefront-nadeenabuobeads-projects.vercel.app/auth/logout",
  "https://naia-stylist.vercel.app/auth/logout"
]
javascript_origins = [
  "https://naia-stylist-staging-nadeenabuobeads-projects.vercel.app",
  "https://nadine-storefront-nadeenabuobeads-projects.vercel.app",
  "https://naia-stylist.vercel.app"
]

[build]
automatically_update_urls_on_dev = true
